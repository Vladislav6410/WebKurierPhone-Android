name: 🤖 Android CI (WebKurierPhone-Android)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build + Lint + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # Official Gradle 8.7 wrapper with a pinned distribution checksum.
      - name: 🧰 Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 🧪 Verify Gradle
        run: |
          ./gradlew --version

      - name: 🧹 Lint (Android)
        run: |
          ./gradlew :app:lintDebug

      - name: ✅ Unit tests
        run: |
          ./gradlew :app:testDebugUnitTest

      - name: 🏗 Build Debug APK
        run: |
          ./gradlew :app:assembleDebug

      - name: Check all variants
        run: ./gradlew :app:check

      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

      - name: 📎 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebKurierPhone-Android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
